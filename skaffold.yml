#skaffold bar bar image bnane ke problem ko solve karta hai
#ye khud monitor kerta hai and image create kerta hai

apiVersion: skaffold/v4beta13
kind: Config

build:
  tagPolicy:
    sha256: {}
  artifacts:
    - image: ai-orchestration
      context: ai-orchestration
      docker:
        dockerfile: dockerfile
      sync:
        infer:
          - 'src/**'
          - 'app/src'


    - image: agent
      context: sandbox/agent
      docker:
        dockerfile: dockerfile
    
    - image: router
      context: sandbox/router
      docker:
        dockerfile: dockerfile

    - image: sandbox
      context: sandbox/server
      docker:
        dockerfile: Dockerfile

    - image: template
      context: sandbox/template
      docker:
        dockerfile: Dockerfile

#ab in sabko apply karne ke liye manifests likhenge

manifests: 
  rawYaml:
    - k8s/ai-deployment.yml
    - k8s/ai-service.yml
    - k8s/ingress.yml
    - k8s/rbac.yml
    - k8s/router-deployment.yml
    - k8s/router-service.yml
    - k8s/sandbox-deployment.yml
    - k8s/sandbox-service.yml
